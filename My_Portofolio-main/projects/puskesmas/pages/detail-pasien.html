<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detail Pasien — Puskesmas Karangan Dalam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../css/style.css" rel="stylesheet"/>
</head>
<body>
<div class="app-wrapper">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="sidebar-logo">
        <div class="logo-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <div><div class="logo-text">Puskesmas</div><div class="logo-sub">Karangan Dalam</div></div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu Utama</div>
      <a href="dashboard.html" class="sidebar-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
      <a href="pasien.html" class="sidebar-link active"><i class="bi bi-people-fill"></i><span>Data Pasien</span><span class="sidebar-badge" id="pasien-count">0</span></a>
      <a href="tambah-pasien.html" class="sidebar-link"><i class="bi bi-person-plus-fill"></i><span>Pendaftaran Baru</span></a>
      <div class="nav-section-label">Layanan</div>
      <a href="poli.html" class="sidebar-link"><i class="bi bi-hospital"></i><span>Poli & Antrian</span></a>
      <a href="laporan.html" class="sidebar-link"><i class="bi bi-bar-chart-line-fill"></i><span>Laporan</span></a>
      <div class="nav-section-label">Sistem</div>
      <a href="#" class="sidebar-link" onclick="logout(); return false;"><i class="bi bi-box-arrow-right"></i><span>Keluar</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
        <div><p class="user-name" id="user-name">Loading...</p><p class="user-role" id="user-role">Admin</p></div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">
        <h2>Detail Pasien</h2>
        <p id="pasien-subtitle">Rekam Medis Pasien</p>
      </div>
      <div class="topbar-actions">
        <a href="pasien.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Kembali</a>
        <a href="#" class="btn-icon" onclick="logout(); return false;"><i class="bi bi-box-arrow-right"></i></a>
      </div>
    </div>

    <div class="page-content" id="detail-content">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Memuat data...</p>
      </div>
    </div>

    <div class="app-footer">
      <p>&copy; 2026 Puskesmas Karangan Dalam. Hak Cipta Dilindungi.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'));
  const data = getPasienData();
  const p = data.find(x => x.id === id);

  document.getElementById('pasien-count').textContent = data.length;

  if (!p) {
    document.getElementById('detail-content').innerHTML = `
      <div class="empty-state">
        <i class="bi bi-person-x"></i>
        <p>Data pasien tidak ditemukan.</p>
        <a href="pasien.html" class="btn btn-primary btn-sm">Kembali ke Data Pasien</a>
      </div>`;
    return;
  }

  document.getElementById('pasien-subtitle').textContent = `${p.no_rm} — ${p.nama}`;

  document.getElementById('detail-content').innerHTML = `
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card-section text-center p-4 mb-3">
          <div style="width:80px;height:80px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px;color:white;">
            <i class="bi bi-person-fill"></i>
          </div>
          <h5 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;margin:0">${p.nama}</h5>
          <p style="color:var(--text-muted);font-size:13px;margin:4px 0 12px">${p.jenis_kelamin === 'L' ? 'Laki-laki' : 'Perempuan'} · ${calcAge(p.tanggal_lahir)}</p>
          ${statusBadge(p.status)}
          <hr style="border-color:var(--border)"/>
          <div style="text-align:left">
            <div class="d-flex justify-content-between mb-2">
              <span style="font-size:12px;color:var(--text-muted)">No. Rekam Medis</span>
              <strong style="font-size:12px;color:var(--primary)">${p.no_rm}</strong>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span style="font-size:12px;color:var(--text-muted)">Poli</span>
              <strong style="font-size:12px">Poli ${p.poli}</strong>
            </div>
            <div class="d-flex justify-content-between">
              <span style="font-size:12px;color:var(--text-muted)">Tgl Daftar</span>
              <strong style="font-size:12px">${formatDate(p.tanggal_daftar)}</strong>
            </div>
          </div>
        </div>

        <div class="card-section p-3">
          <div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:12px"><i class="bi bi-telephone me-2"></i>Kontak</div>
          <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">No. HP</div>
          <div style="font-size:14px;font-weight:600">${p.no_hp || 'Tidak tersedia'}</div>
          <hr style="border-color:var(--border)"/>
          <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">Alamat</div>
          <div style="font-size:13px">${p.alamat}</div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card-section mb-3">
          <div class="card-header-custom">
            <h5><i class="bi bi-clipboard2-pulse me-2 text-primary"></i>Data Medis & Keluhan</h5>
          </div>
          <div class="p-4">
            <div class="row g-3">
              <div class="col-md-6">
                <div style="background:var(--accent);border-radius:var(--radius-sm);padding:16px">
                  <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--primary-dark);margin-bottom:4px">Keluhan Utama</div>
                  <div style="font-size:14px">${p.keluhan}</div>
                </div>
              </div>
              <div class="col-md-6">
                <div style="background:#E8F0FA;border-radius:var(--radius-sm);padding:16px">
                  <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--info);margin-bottom:4px">Poli Tujuan</div>
                  <div style="font-size:14px;font-weight:600">Poli ${p.poli}</div>
                </div>
              </div>
              <div class="col-md-4">
                <div style="background:#E8F5EE;border-radius:var(--radius-sm);padding:16px">
                  <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--success);margin-bottom:4px">Tanggal Lahir</div>
                  <div style="font-size:14px">${formatDate(p.tanggal_lahir)}</div>
                </div>
              </div>
              <div class="col-md-4">
                <div style="background:#FEF5E7;border-radius:var(--radius-sm);padding:16px">
                  <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--warning);margin-bottom:4px">Usia</div>
                  <div style="font-size:14px;font-weight:600">${calcAge(p.tanggal_lahir)}</div>
                </div>
              </div>
              <div class="col-md-4">
                <div style="background:var(--accent);border-radius:var(--radius-sm);padding:16px">
                  <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--primary-dark);margin-bottom:4px">Status</div>
                  <div style="font-size:14px">${statusBadge(p.status)}</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card-section">
          <div class="card-header-custom">
            <h5><i class="bi bi-clock-history me-2 text-primary"></i>Riwayat Kunjungan</h5>
          </div>
          <div class="p-4">
            <div class="activity-item">
              <div class="activity-dot" style="background:var(--primary)"></div>
              <div>
                <div class="activity-text"><strong>Kunjungan pertama</strong> — ${formatDate(p.tanggal_daftar)}</div>
                <div class="activity-time">Poli ${p.poli} · Keluhan: ${p.keluhan}</div>
              </div>
            </div>
            <div class="activity-item">
              <div class="activity-dot" style="background:var(--text-muted);opacity:.4"></div>
              <div>
                <div class="activity-text" style="color:var(--text-muted)">Riwayat kunjungan berikutnya akan tampil di sini</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-3">
      <a href="pasien.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Kembali</a>
      <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Cetak</button>
    </div>
  `;
});
</script>
  <script src="../../protect.js"></script>
</body>
</html>
