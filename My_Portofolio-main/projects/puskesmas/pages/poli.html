<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poli & Antrian — Puskesmas Karangan Dalam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="../css/style.css" rel="stylesheet"/>
</head>
<body>
<div class="app-wrapper">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="sidebar-logo">
        <div class="logo-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <div><div class="logo-text">Puskesmas</div><div class="logo-sub">Karangan Dalam</div></div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu Utama</div>
      <a href="dashboard.html" class="sidebar-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
      <a href="pasien.html" class="sidebar-link"><i class="bi bi-people-fill"></i><span>Data Pasien</span><span class="sidebar-badge" id="pasien-count">0</span></a>
      <a href="tambah-pasien.html" class="sidebar-link"><i class="bi bi-person-plus-fill"></i><span>Pendaftaran Baru</span></a>
      <div class="nav-section-label">Layanan</div>
      <a href="poli.html" class="sidebar-link active"><i class="bi bi-hospital"></i><span>Poli & Antrian</span></a>
      <a href="laporan.html" class="sidebar-link"><i class="bi bi-bar-chart-line-fill"></i><span>Laporan</span></a>
      <div class="nav-section-label">Sistem</div>
      <a href="#" class="sidebar-link" onclick="logout(); return false;"><i class="bi bi-box-arrow-right"></i><span>Keluar</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
        <div><p class="user-name" id="user-name">Loading...</p><p class="user-role" id="user-role">Admin</p></div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">
        <h2>Poli & Antrian</h2>
        <p>Status antrian per poli hari ini</p>
      </div>
      <div class="topbar-actions">
        <a href="#" class="btn-icon" onclick="logout(); return false;"><i class="bi bi-box-arrow-right"></i></a>
      </div>
    </div>

    <div class="page-content">
      <div class="row g-3 mb-4" id="poli-cards"></div>

      <div class="row g-3" id="antrian-section"></div>
    </div>

    <div class="app-footer">
      <p>&copy; 2026 Puskesmas Karangan Dalam. Hak Cipta Dilindungi.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
const poliConfig = [
  { key: 'Umum', label: 'Poli Umum', icon: 'bi-person-heart', color: 'var(--primary)', bg: 'var(--accent)' },
  { key: 'KIA', label: 'Poli KIA', icon: 'bi-gender-female', color: 'var(--info)', bg: '#E8F0FA' },
  { key: 'Anak', label: 'Poli Anak', icon: 'bi-emoji-smile', color: 'var(--warning)', bg: '#FEF5E7' },
  { key: 'Gigi', label: 'Poli Gigi', icon: 'bi-clipboard2-heart', color: 'var(--success)', bg: '#E8F5EE' },
];

document.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  const data = getPasienData();
  document.getElementById('pasien-count').textContent = data.length;

  const cardsEl = document.getElementById('poli-cards');
  poliConfig.forEach(poli => {
    const pasien = data.filter(p => p.poli === poli.key);
    const antri = pasien.filter(p => p.status === 'baru' || p.status === 'aktif').length;
    const selesai = pasien.filter(p => p.status === 'selesai').length;
    cardsEl.innerHTML += `
      <div class="col-6 col-lg-3">
        <div class="stat-card" style="border-left: 4px solid ${poli.color}">
          <div class="stat-icon" style="background:${poli.bg};color:${poli.color}"><i class="bi ${poli.icon}"></i></div>
          <div>
            <div class="stat-value">${antri}</div>
            <div class="stat-label">${poli.label}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${selesai} selesai</div>
          </div>
        </div>
      </div>
    `;
  });

  const antriEl = document.getElementById('antrian-section');
  poliConfig.forEach(poli => {
    const pasien = data.filter(p => p.poli === poli.key);
    antriEl.innerHTML += `
      <div class="col-lg-6">
        <div class="card-section">
          <div class="card-header-custom">
            <h5><i class="bi ${poli.icon} me-2" style="color:${poli.color}"></i>${poli.label}</h5>
            <span style="font-size:12px;background:${poli.bg};color:${poli.color};padding:3px 10px;border-radius:20px;font-weight:600">${pasien.length} pasien</span>
          </div>
          ${pasien.length === 0 ? `<div class="empty-state py-4"><i class="bi bi-inbox" style="font-size:32px;opacity:.3;display:block;margin-bottom:8px"></i><p style="font-size:13px">Belum ada pasien</p></div>` :
          `<div class="table-responsive">
            <table class="table table-custom mb-0">
              <thead><tr><th>Antrian</th><th>Nama</th><th>Keluhan</th><th>Status</th></tr></thead>
              <tbody>
                ${pasien.map((p, i) => `
                  <tr>
                    <td><span style="font-size:18px;font-weight:800;color:${poli.color}">${String(i+1).padStart(2,'0')}</span></td>
                    <td>
                      <div style="font-weight:600;font-size:13px">${p.nama}</div>
                      <div style="font-size:11px;color:var(--text-muted)">${p.no_rm}</div>
                    </td>
                    <td style="font-size:12px;color:var(--text-muted);max-width:120px">${p.keluhan}</td>
                    <td>${statusBadge(p.status)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`}
        </div>
      </div>
    `;
  });
});
</script>
  <script src="../../protect.js"></script>
</body>
</html>
