<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Puskesmas Karangan Dalam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body class="login-page d-flex align-items-center justify-content-center min-vh-100">

  <div class="login-wrapper">
    <div class="login-brand text-center mb-4">
      <div class="brand-icon mb-3">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <h1 class="brand-title">Puskesmas Karangan Dalam</h1>
      <p class="brand-sub">Sistem Informasi Data Pasien</p>
    </div>

    <div class="login-card">
      <div id="login-alert" class="alert alert-danger d-none" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>Username atau password salah.
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" autocomplete="off"/>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password"/>
          <button class="btn btn-outline-secondary" type="button" id="togglePwd">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-primary btn-login w-100 mb-3" id="btn-login" onclick="doLogin()">
        <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
      </button>

      <p class="text-center text-muted small mb-0">
        Demo: <strong>admin</strong> / <strong>admin123</strong>
      </p>
    </div>

    <p class="text-center text-muted small mt-4">
      &copy; 2026 Puskesmas Karangan Dalam. Hak Cipta Dilindungi.
    </p>
  </div>

  <script>
    document.getElementById('togglePwd').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    window.addEventListener('DOMContentLoaded', function() {
      const existingUser = localStorage.getItem('puskesmas_user');
      if (existingUser) {
        window.location.href = 'pages/dashboard.html';
      }
    });

    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const alertEl = document.getElementById('login-alert');
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Memproses...';

      setTimeout(function() {
        if (u === 'admin' && p === 'admin123') {
          localStorage.setItem('puskesmas_user', JSON.stringify({ name: 'Administrator', role: 'Admin' }));
          window.location.href = 'pages/dashboard.html';
        } else {
          alertEl.classList.remove('d-none');
          setTimeout(() => alertEl.classList.add('d-none'), 3000);
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk';
        }
      }, 500);
    }
  </script>
  <script src="../protect.js"></script>
</body>
</html>
